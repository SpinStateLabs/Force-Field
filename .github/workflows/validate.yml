name: Validate plugin manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: JSON schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install ajv-cli (pinned)
        run: npm install --no-save ajv-cli@5.0.0 ajv-formats@2.1.1

      - name: Validate shipped manifests against the FIELD schema
        run: |
          schema=plugins/field/skills/field/manifest-schema.json
          for f in plugins/field/skills/field/templates/*.yaml plugins/field/hooks/test/field-manifest.yaml field-manifest.draft.yaml; do
            npx ajv validate --spec=draft2020 -c ajv-formats -s "$schema" -d "$f" || exit 1
          done
          # Negative case: the step must be able to fail. An unknown enforcement key is invalid.
          sed 's/^enforcement:$/enforcement:\n  not_a_field_key: true/' plugins/field/skills/field/templates/field-manifest-default.yaml > "$RUNNER_TEMP/bad.yaml"
          grep -q '^  not_a_field_key: true$' "$RUNNER_TEMP/bad.yaml" || { echo "negative case not constructed"; exit 1; }
          if npx ajv validate --spec=draft2020 -c ajv-formats -s "$schema" -d "$RUNNER_TEMP/bad.yaml"; then
            echo "schema accepted an unknown enforcement key"; exit 1
          fi

      - name: Validate the deny_patterns_verdict key (positive and negative)
        run: |
          schema=plugins/field/skills/field/manifest-schema.json
          fixture=plugins/field/hooks/test/field-manifest.yaml
          sed 's/^  irreversible_actions:\(.*\)$/  irreversible_actions:\1\n    deny_patterns_verdict: policy/' "$fixture" > "$RUNNER_TEMP/verdict-ok.yaml"
          grep -q '^    deny_patterns_verdict: policy$' "$RUNNER_TEMP/verdict-ok.yaml" || { echo "positive case not constructed"; exit 1; }
          npx ajv validate --spec=draft2020 -c ajv-formats -s "$schema" -d "$RUNNER_TEMP/verdict-ok.yaml" || exit 1
          sed 's/deny_patterns_verdict: policy/deny_patterns_verdict: maybe/' "$RUNNER_TEMP/verdict-ok.yaml" > "$RUNNER_TEMP/verdict-bad.yaml"
          grep -q 'deny_patterns_verdict: maybe' "$RUNNER_TEMP/verdict-bad.yaml" || { echo "negative case not constructed"; exit 1; }
          if npx ajv validate --spec=draft2020 -c ajv-formats -s "$schema" -d "$RUNNER_TEMP/verdict-bad.yaml"; then
            echo "schema accepted an invalid deny_patterns_verdict"; exit 1
          fi

      - name: Validate the kill_switch local_sentinel keys (positive and negative)
        run: |
          schema=plugins/field/skills/field/manifest-schema.json
          fixture=plugins/field/hooks/test/field-manifest.yaml
          sed 's/^    method: file$/    method: file\n    local_sentinel: .claude\/state\/ESTATE_KILL\n    sentinel_max_age_s: 30/' "$fixture" > "$RUNNER_TEMP/sentinel-ok.yaml"
          grep -q '^    sentinel_max_age_s: 30$' "$RUNNER_TEMP/sentinel-ok.yaml" || { echo "positive case not constructed"; exit 1; }
          npx ajv validate --spec=draft2020 -c ajv-formats -s "$schema" -d "$RUNNER_TEMP/sentinel-ok.yaml" || exit 1
          sed 's/sentinel_max_age_s: 30/sentinel_max_age_s: 0/' "$RUNNER_TEMP/sentinel-ok.yaml" > "$RUNNER_TEMP/sentinel-bad.yaml"
          grep -q 'sentinel_max_age_s: 0$' "$RUNNER_TEMP/sentinel-bad.yaml" || { echo "negative case not constructed"; exit 1; }
          if npx ajv validate --spec=draft2020 -c ajv-formats -s "$schema" -d "$RUNNER_TEMP/sentinel-bad.yaml"; then
            echo "schema accepted sentinel_max_age_s: 0"; exit 1
          fi

      - name: Validate marketplace.json structure
        run: |
          echo "Checking .claude-plugin/marketplace.json exists..."
          test -f .claude-plugin/marketplace.json
          echo "Validating JSON syntax..."
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json', 'utf8'))"
          echo "Checking required fields..."
          node -e "
            const m = JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            if (!m.name) throw new Error('marketplace.json missing required field: name');
            if (!m.owner) throw new Error('marketplace.json missing required field: owner');
            if (!Array.isArray(m.plugins) || m.plugins.length === 0) throw new Error('marketplace.json must have a non-empty plugins array');
            for (const p of m.plugins) {
              if (!p.name) throw new Error('plugin entry missing name');
              if (!p.source) throw new Error('plugin entry missing source: ' + p.name);
            }
            console.log('marketplace.json OK');
          "

      - name: Validate each plugin manifest
        run: |
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            echo ""
            echo "Validating $manifest..."
            node -e "JSON.parse(require('fs').readFileSync('$manifest', 'utf8'))"
            node -e "
              const p = JSON.parse(require('fs').readFileSync('$manifest', 'utf8'));
              if (!p.name) throw new Error('plugin.json missing name: $manifest');
              if (!p.version) throw new Error('plugin.json missing version: $manifest');
              console.log('  name:', p.name);
              console.log('  version:', p.version);
              console.log('  OK');
            "
          done

      - name: Verify plugin sources exist
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            const fs = require('fs');
            for (const p of m.plugins) {
              if (typeof p.source === 'string') {
                const path = p.source.replace(/^\.\//, '');
                if (!fs.existsSync(path)) throw new Error('Plugin source not found: ' + path);
                console.log('source ok:', p.source);
              }
            }
          "

      - name: Check skill files exist
        run: |
          for skill_dir in plugins/*/skills/*/; do
            skill_md="${skill_dir}SKILL.md"
            echo "Checking $skill_md..."
            test -f "$skill_md" || (echo "Missing SKILL.md in $skill_dir" && exit 1)
            # SKILL.md must start with YAML frontmatter
            head -n 1 "$skill_md" | grep -q "^---$" || (echo "$skill_md missing YAML frontmatter" && exit 1)
            echo "  OK"
          done

      - name: Check command files have description frontmatter
        run: |
          for cmd_file in plugins/*/commands/*.md; do
            echo "Checking $cmd_file..."
            head -n 5 "$cmd_file" | grep -q "^description:" || (echo "$cmd_file missing 'description' in frontmatter" && exit 1)
            echo "  OK"
          done

  gate-tests:
    name: FIELD Enforcement Gate tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Smoke test (E1-E4, L)
        run: |
          out=$(bash plugins/field/hooks/test/run.sh)
          echo "$out"
          echo "$out" | grep -q "LEDGER INTACT"
      - name: E5 and ledger-path tests
        run: bash plugins/field/hooks/test/run_e5.sh
      - name: Launcher tests (no Python, stub Python, fallbacks)
        run: bash plugins/field/hooks/test/run_launcher.sh
      - name: E3 policy-verdict tests (ADR-0071)
        run: bash plugins/field/hooks/test/run_e3_policy.sh
      - name: Estate kill sentinel tests (ADR-0072)
        run: bash plugins/field/hooks/test/run_estate_kill.sh
      - name: PostToolUse evidence-hook tests (ADR-0075 part (a))
        run: bash plugins/field/hooks/test/run_post_hook.sh
      - name: Link tests (symlinks, ADR-0080)
        run: bash plugins/field/hooks/test/run_links.sh
      - name: Shell-form tests (cmd /c, colon-bound parameters, link globs; PR 15)
        run: bash plugins/field/hooks/test/run_shell_forms.sh
      - name: Incremental ledger index tests (differential against the old code, sidecar attacks)
        run: bash plugins/field/hooks/test/run_ledger_index.sh

  # ADR-0080: the gate runs on Windows (Git Bash, as Claude Code runs hooks there) and must resolve junctions and
  # symlinks, strip extended-length prefixes and NTFS streams, and see 8.3 names. run_all.sh runs every suite, fails
  # on any SKIP that is not in hooks/test/skip-allowlist-windows.txt, and checks the launcher has no carriage return.
  gate-tests-windows:
    name: FIELD Enforcement Gate tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Toolchain (the suites call python3 from Git Bash)
        run: |
          echo "uname: $(uname -s)"; echo "bash: $BASH_VERSION"; which bash
          # setup-python on Windows provides python.exe; the suites and hooks.json call python3
          if ! python3 -c 'import yaml' 2>/dev/null; then
            py_exe=$(command -v python)
            cp "$py_exe" "$(dirname "$py_exe")/python3.exe"
          fi
          which -a python3; python3 --version; python3 -c 'import yaml, sys; print("PyYAML", yaml.__version__, sys.executable)'
          git config --show-origin core.autocrlf || echo "core.autocrlf unset"
      - name: Run every gate suite (SKIPs must equal the allowlist; no CR in the launcher)
        run: bash plugins/field/hooks/test/run_all.sh
